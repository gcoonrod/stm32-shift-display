; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8_128k]
; Pinned 2026-09-15. Unpinned, this resolves to ststm32 20.0.0, whose Arduino
; core 4.x (framework-arduinoststm32 4.30000.0) breaks STM32duino RTC and Low
; Power internally, and breaks this source's void*-style RTC seconds callback.
; 19.7.1 is the newest platform still on the 2.x core line (4.21200.0); older
; platforms contemporary with this source (17.x/18.x) can no longer resolve
; their framework package from the registry at all. See openspec change
; align-docs-and-dev-env, task 1.4.
platform = ststm32@19.7.1
;board = bluepill_f103c8_128k
board = genericSTM32F103C8
framework = arduino

debug_tool = stlink

board_build.mcu = stm32f103c8t6

build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
;  -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF

lib_deps =
  stm32duino/STM32duino RTC @ ^1.4.0
  stm32duino/STM32duino Low Power @ ^1.2.5
  bxparks/AceButton @ ^1.10.1
  ppedro74/SerialCommands @ ^2.2.0